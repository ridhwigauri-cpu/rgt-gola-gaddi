name: Build RGT APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - run: flutter pub get
      - name: Kisan APK
        run: flutter build apk --release --flavor kisan --dart-define=APP=kisan
      - name: Admin APK
        run: flutter build apk --release --flavor admin --dart-define=APP=admin
      - uses: actions/upload-artifact@v4
        with:
          name: rgt-apks
          path: build/app/outputs/flutter-apk/*.apk
